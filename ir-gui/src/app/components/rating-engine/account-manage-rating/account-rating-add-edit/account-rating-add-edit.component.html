<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>
        {{ isEditMode ? "Update" : "Create" }} Account Rating
      </h4>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        (click)="toggleCollapse()"
        [class.active]="isCollapsed"
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        title="Collapse"
        id="collapse-header"
        matTooltip="Collapse"
      >
        <i class="ti ti-chevron-up"></i>
      </a>
    </li>
    <li>
      <div class="page-btn mt-0">
        <button
          type="button"
          class="btn me-2 btn-secondary"
          (click)="onClose()"
        >
          <i class="feather icon-arrow-left me-2"></i>Back to Account List
        </button>
      </div>
    </li>
  </ul>
</div>

<div class="card shadow-sm border-0 d-flex flex-column h-100">
  <div class="card-body flex-grow-1 overflow-auto">
    <form [formGroup]="accountForm">
      <div class="row g-3">
        <!-- Partner Selection -->
        <div class="col-lg-6 col-md-12">
          <custom-select
            label="Partner"
            [formControlRef]="accountForm | getControl: 'partnerId'"
            [options]="partnerListData"
            optionLabel="partnerName"
            optionValue="partnerId"
            [filter]="true"
            
            placeholder="Select a Partner"
          ></custom-select>
        </div>

        <!-- Account Code -->
        <div class="col-lg-6 col-md-12">
          <custom-input
            [label]="accountCodeLabel"
            [formControlRef]="accountForm | getControl: 'accountCode'"
            [placeholder]="'Enter ' + accountCodeLabel"
          ></custom-input>
        </div>

        <!-- Partner Type Selection (Always shown once partner is selected) -->
        <div class="col-lg-12 col-md-12" *ngIf="accountForm.get('partnerId')?.value">
          <div class="mb-3 p-3 bg-light rounded-3 border">
            <label class="form-label fw-semibold">
              Account Type 
              <span *ngIf="isBothPartnerType" class="text-primary fs-12 ms-2">(Selected Partner provides BOTH - please choose one)</span>
              <span *ngIf="!isBothPartnerType" class="text-muted fs-12 ms-2">(Auto-selected based on Partner type)</span>
            </label>
            <div class="d-flex gap-4 mt-2">
              <div class="form-check" *ngFor="let opt of partnerTypeOptions">
                <input
                  class="form-check-input"
                  type="radio"
                  [id]="'type_' + opt.value"
                  [value]="opt.value"
                  formControlName="partnerType"
                />
                <label class="form-check-label" [for]="'type_' + opt.value">
                  {{ opt.label }}
                </label>
              </div>
            </div>
            <div
              *ngIf="
                accountForm.get('partnerType')?.invalid &&
                (accountForm.get('partnerType')?.touched || accountForm.get('partnerType')?.dirty)
              "
              class="text-danger fs-12 mt-1"
            >
              Partner Type is required.
            </div>
          </div>
        </div>

        <!-- Product Plan -->
        <div class="col-lg-6 col-md-12" *ngIf="accountForm.get('partnerType')?.value">
          <custom-select
            label="Product Plan"
            [formControlRef]="accountForm | getControl: 'productPlanId'"
            [options]="productPlansListData"
            optionLabel="productPlanName"
            optionValue="productPlanId"
            [filter]="true"
            
            placeholder="Select a Product Plan"
          ></custom-select>
        </div>
      </div>
    </form>
  </div>

  <div class="card-footer bg-white border-top p-3 d-flex justify-content-end gap-2">
    <button
      type="button"
      class="btn btn-outline-secondary px-4"
      (click)="onClose()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-primary px-4"
      (click)="submit()"
      [disabled]="accountForm.invalid"
    >
      <i class="ti ti-device-floppy me-1"></i>
      {{ isEditMode ? "Update" : "Save" }} Changes
    </button>
  </div>
</div>
