<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">

      <div class="modal-header">
        <div class="page-title">
          <h4>
            {{ selectedItem?.id ? "Update " : "Create " }}Clearing House
          </h4>
        </div>
        <button type="button" class="close" (click)="onClose()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <form [formGroup]="clearingHouseForm">
          <div class="row">

            <!-- Name -->
            <div class="col-lg-12">
              <custom-input
                label="Name"
                [formControlRef]="clearingHouseForm | getControl: 'name'"
                type="text"
              ></custom-input>
            </div>

            <!-- Type -->
            <div class="col-lg-6">
              <custom-select
                label="Type"
                [formControlRef]="clearingHouseForm | getControl: 'type'"
                [options]="typeOptions"
                optionValue="value"
                optionLabel="label"
                [filter]="true"
                
              ></custom-select>
            </div>

            <!-- Status -->
            <div class="col-lg-6">
              <custom-select
                label="Status"
                [formControlRef]="clearingHouseForm | getControl: 'status'"
                [options]="statusOptions"
                optionValue="value"
                optionLabel="label"
                [filter]="true"
                
              ></custom-select>
            </div>

            <!-- Default Currency -->
            <div class="col-lg-6">
              <custom-select
                label="Default Currency"
                [options]="currencyList"
                optionValue="currencyCode"
                optionLabel="currencyCode"
                [formControlRef]="clearingHouseForm | getControl: 'defaultCurrency'"
                [filter]="true"
                placeholder="Select Currency"
              ></custom-select>
            </div>

            <!-- Timezone -->
            <div class="col-lg-6">
              <custom-input
                label="Timezone"
                [formControlRef]="clearingHouseForm | getControl: 'timezone'"
                type="text"
              ></custom-input>
            </div>

            <!-- Protocols (checkboxes) -->
            <div class="col-lg-12">
              <div class="mb-3 col">
                <mat-label class="col-form-label col-lg-2">
                  Protocols <span class="text-danger">*</span>
                </mat-label>
                <div class="d-flex flex-wrap gap-3 mt-1">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="proto_SFTP"
                      [checked]="true"
                      [disabled]="true"
                    />
                    <label class="form-check-label" for="proto_SFTP">
                      SFTP
                    </label>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3"
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          class="btn btn-primary fs-13 fw-medium p-2 px-3"
          (click)="submit()"
        >
          {{ selectedItem?.id ? "Update" : "Save" }}
        </button>
      </div>

    </div>
  </div>
</div>
