<!-- Page Header -->
<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>Download CDRs</h4>
      <h6>Filter and export Call Detail Records (CDRs) as Excel spreadsheet</h6>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        matTooltip="Collapse"
        matTooltipPosition="above"
        id="collapse-header"
      >
        <i class="ti ti-chevron-up"></i>
      </a>
    </li>
  </ul>
</div>

<!-- Main Form Card -->
<div class="card table-list-card">
  <div class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3">
    <div class="d-flex align-items-center gap-3">
      <h5 class="fw-bold mb-0">CDR Export Filters</h5>
    </div>
  </div>

  <div class="card-body p-4">
    <form [formGroup]="cdrForm" (ngSubmit)="exportExcel()">
      <div class="row g-4">
        <!-- 1. Service Type (Required) -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Service Type"
            [options]="serviceTypeOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'serviceType'"
            [filter]="false"
            [showClear]="false"
          ></custom-select>
        </div>

        <!-- 2. Calling Or Subscriber (Dynamic Label) -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-input
            [label]="callingLabel"
            [formControlRef]="cdrForm | getControl: 'callingOrSubscriber'"
            type="text"
            [placeholder]="'Enter ' + callingLabel"
          ></custom-input>
        </div>

        <!-- 3. Called Or APN (Dynamic Label) -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-input
            [label]="calledLabel"
            [formControlRef]="cdrForm | getControl: 'calledOrApn'"
            type="text"
            [placeholder]="'Enter ' + calledLabel"
          ></custom-input>
        </div>

        <!-- 4. Incoming Account ID -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Incoming Account"
            [options]="incomingAccountOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'incomingAccountId'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 5. Outgoing Account ID -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Outgoing Account"
            [options]="outgoingAccountOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'outgoingAccountId'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 6. Zone Name -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Zone Name"
            [options]="zoneOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'zoneName'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 7. Home PLMN -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Home PLMN"
            [options]="homePlmnOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'homePlmn'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 8. Visited PLMN -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Visited PLMN"
            [options]="visitedPlmnOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'visitedPlmn'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 9. Line of Business -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Line of Business"
            [options]="lobOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'lineOfBusiness'"
            [filter]="true"
            [showClear]="false"
          ></custom-select>
        </div>

        <!-- 10. Incoming Rating Status -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Incoming Rating Status"
            [options]="statusOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'incomingRatingStatus'"
            [filter]="false"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 11. Outgoing Rating Status -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-select
            label="Outgoing Rating Status"
            [options]="statusOptions"
            optionValue="value"
            optionLabel="label"
            [formControlRef]="cdrForm | getControl: 'outgoingRatingStatus'"
            [filter]="false"
            [showClear]="true"
          ></custom-select>
        </div>

        <!-- 12. Call Type (Hidden when serviceType === 'USAGE') -->
        @if (cdrForm.get('serviceType')?.value !== 'USAGE') {
          <div class="col-lg-4 col-md-6 col-12">
            <custom-select
              label="Call Type"
              [options]="callTypeOptions"
              optionValue="value"
              optionLabel="label"
              [formControlRef]="cdrForm | getControl: 'callType'"
              [filter]="true"
              [showClear]="true"
            ></custom-select>
          </div>
        }

        <!-- 13. Start Time / Created Date From -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-date
            [formControlRef]="cdrForm | getControl: 'fromTime'"
            [showTime]="true"
            [showIcon]="true"
            [showButtonBar]="true"
            [timeOnly]="false"
            [placeholder]="'Select From'"
            [dateFormat]="'yy-mm-dd'"
            [hourFormat]="'24'"
            [label]="cdrForm.get('serviceType')?.value === 'SMS' ? 'Created Date From' : 'Start Time From'"
            appendTo="body"
          ></custom-date>
        </div>

        <!-- 14. Start Time / Created Date To -->
        <div class="col-lg-4 col-md-6 col-12">
          <custom-date
            [formControlRef]="cdrForm | getControl: 'toTime'"
            [showTime]="true"
            [showIcon]="true"
            [showButtonBar]="true"
            [timeOnly]="false"
            [placeholder]="'Select To'"
            [dateFormat]="'yy-mm-dd'"
            [hourFormat]="'24'"
            [label]="cdrForm.get('serviceType')?.value === 'SMS' ? 'Created Date To' : 'Start Time To'"
            appendTo="body"
          ></custom-date>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-end pt-4 mt-3 border-top gap-3">
        <button
          type="button"
          class="btn btn-outline-secondary fs-13 fw-medium p-2 px-4"
          (click)="resetFilters()"
        >
          <i class="ti ti-rotate me-2"></i>Reset Filters
        </button>
        <button
          type="submit"
          class="btn btn-primary fs-13 fw-medium p-2 px-4"
          [disabled]="cdrForm.invalid"
        >
          <i class="ti ti-download me-2"></i>Export CDR Excel
        </button>
      </div>
    </form>
  </div>
</div>
