<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>
            {{ selectedOrganization?.id ? "Update " : "Create " }}
            Organization
          </h4>
        </div>
        <button
          type="button"
          class="close"
          (click)="onClose()"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="row">
            <div class="col-lg-12">
              <custom-input
                label="Name"
                [formControlRef]="organizationForm | getControl: 'name'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="Suffix Name"
                [formControlRef]="organizationForm | getControl: 'suffixName'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="Legal Name"
                [formControlRef]="organizationForm | getControl: 'legalName'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="Address"
                [formControlRef]="organizationForm | getControl: 'address'"
                type="text"
              ></custom-input>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3"
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          class="btn btn-primary fs-13 fw-medium p-2 px-3"
          (click)="submit()"
        >
          {{ selectedOrganization?.id ? "Update" : "Save" }}
        </button>
      </div>
    </div>
  </div>
</div>
