<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>{{ selectedPartnerRating?.partnerId ? "Update" : "Create" }} Partner</h4>
        </div>
        <button type="button" class="close" (click)="onClose()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body" style="max-height: 72vh; overflow-y: auto;">
        <form [formGroup]="partnerRatingForm">

          <!-- Basic Information -->
          <h6 class="mb-3 fw-semibold text-primary">Basic Information</h6>
          <div class="row">
            <div class="col-lg-6">
              <custom-input
                label="Partner Name"
                [formControlRef]="partnerRatingForm | getControl: 'partnerName'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Partner Code"
                [formControlRef]="partnerRatingForm | getControl: 'partnerCode'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-select
                label="Partner Type"
                [options]="partnerTypeOptions"
                optionValue="value"
                optionLabel="label"
                [formControlRef]="partnerRatingForm | getControl: 'partnerType'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-select
                label="Status"
                [options]="statusOptions"
                optionValue="value"
                optionLabel="label"
                [formControlRef]="partnerRatingForm | getControl: 'status'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-select
                label="Organization"
                [options]="organizationList"
                optionValue="organizationId"
                optionLabel="name"
                [formControlRef]="partnerRatingForm | getControl: 'organizationId'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-select
                label="Line of Business"
                [formControlRef]="partnerRatingForm | getControl: 'lineOfBusiness'"
                [options]="lineOfBusinessOptions"
                optionValue="value"
                optionLabel="label"
                [filter]="true"
                
              ></custom-select>
            </div>
          </div>

          <!-- Contact Information -->
          <h6 class="mb-3 mt-3 fw-semibold text-primary">Contact Information</h6>
          <div class="row">
            <div class="col-lg-6">
              <custom-input
                label="Contact Person Name"
                [formControlRef]="partnerRatingForm | getControl: 'contactPersonName'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Email"
                [formControlRef]="partnerRatingForm | getControl: 'email'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Phone Number"
                [formControlRef]="partnerRatingForm | getControl: 'phoneNumber'"
                type="text"
              ></custom-input>
            </div>
          </div>

          <!-- Address Information -->
          <h6 class="mb-3 mt-3 fw-semibold text-primary">Address Information</h6>
          <div class="row">
            <div class="col-lg-12">
              <custom-input
                label="Address Line 1"
                [formControlRef]="partnerRatingForm | getControl: 'addressLine1'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-4">
              <custom-input
                label="City"
                [formControlRef]="partnerRatingForm | getControl: 'city'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-4">
              <custom-input
                label="Postal Code"
                [formControlRef]="partnerRatingForm | getControl: 'postalCode'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-4 col-md-6">
              <custom-select
                label="Country"
                [formControlRef]="partnerRatingForm | getControl: 'country'"
                [options]="countryList"
                optionLabel="name"
                optionValue="name"
                [filter]="true"
                
                placeholder="Select a Country"
              ></custom-select>
            </div>
          </div>

          <!-- Interconnect Settings (Visible only for Interconnect) -->
          <ng-container *ngIf="partnerRatingForm.get('lineOfBusiness')?.value === 'INTERCONNECT'">
            <h6 class="mb-3 mt-3 fw-semibold text-primary">Interconnect Settings</h6>
            <div class="row">
            <div class="col-lg-6">
              <custom-select
                label="Interconnect Type"
                [options]="interconnectTypeOptions"
                optionValue="value"
                optionLabel="label"
                [formControlRef]="partnerRatingForm | getControl: 'interconnectType'"
                [filter]="true"
                
              ></custom-select>
            </div>

            <!-- Show IP Address only when Interconnect Type = IP -->
            <div class="col-lg-6" *ngIf="isInterconnectTypeIP">
              <custom-input
                label="IP Address"
                [formControlRef]="partnerRatingForm | getControl: 'ipAddress'"
                type="text"
              ></custom-input>
            </div>

            <!-- Point Code -->
            <div class="col-lg-6">
              <custom-input
                label="Point Code"
                [formControlRef]="partnerRatingForm | getControl: 'pointCode'"
                type="text"
              ></custom-input>
            </div>

            <div class="col-lg-6">
              <custom-input
                label="Routing Prefix"
                [formControlRef]="partnerRatingForm | getControl: 'routingPrefix'"
                type="text"
              ></custom-input>
            </div>
            </div>
          </ng-container>

          <!-- Roaming Settings (Visible only for Roaming) -->
          <ng-container *ngIf="isRoaming">
            <h6 class="mb-3 mt-3 fw-semibold text-primary">Roaming Settings</h6>
            <div class="row">
              <div class="col-lg-6">
                <custom-input
                  label="TADIG Code"
                  [formControlRef]="partnerRatingForm | getControl: 'tadigCode'"
                  type="text"
                ></custom-input>
              </div>
              <div class="col-lg-6">
                <custom-input
                  label="Home PLMN"
                  [formControlRef]="partnerRatingForm | getControl: 'hplmn'"
                  type="text"
                ></custom-input>
              </div>
            </div>
          </ng-container>

          <!-- Billing Information -->
          <h6 class="mb-3 mt-3 fw-semibold text-primary">Billing Information</h6>
          <div class="row">
            <div class="col-lg-6">
              <custom-select
                label="Billing Currency"
                [options]="currencyList"
                optionValue="currencyCode"
                optionLabel="currencyCode"
                [formControlRef]="partnerRatingForm | getControl: 'billingCurrency'"
                [filter]="true"
                placeholder="Select Currency"
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-select
                label="Billing Cycle"
                [options]="billingCycleOptions"
                optionValue="value"
                optionLabel="label"
                [formControlRef]="partnerRatingForm | getControl: 'billingCycle'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Payment Terms"
                [formControlRef]="partnerRatingForm | getControl: 'paymentTerms'"
                type="text"
              ></custom-input>
            </div>
          </div>

          <!-- Financial Information -->
          <h6 class="mb-3 mt-3 fw-semibold text-primary">Financial Information</h6>
          <div class="row">
            <div class="col-lg-6">
              <custom-input
                label="Tax Number"
                [formControlRef]="partnerRatingForm | getControl: 'taxNumber'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Bank Account Number"
                [formControlRef]="partnerRatingForm | getControl: 'bankAccountNumber'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="SWIFT Code"
                [formControlRef]="partnerRatingForm | getControl: 'swiftCode'"
                type="text"
              ></custom-input>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3" (click)="onClose()">
          Cancel
        </button>
        <button class="btn btn-primary fs-13 fw-medium p-2 px-3" (click)="submit()">
          {{ selectedPartnerRating?.partnerId ? "Update" : "Save" }}
        </button>
      </div>

    </div>
  </div>
</div>
