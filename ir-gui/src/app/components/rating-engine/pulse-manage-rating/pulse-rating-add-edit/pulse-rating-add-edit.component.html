<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>
            {{ selectedPulseRating?.pulseId ? "Update " : "Create " }} Pulse
            Rating
          </h4>
        </div>
        <button
          type="button"
          class="close"
          (click)="onClose()"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="row">
            <div class="col-lg-12">
              <custom-input
                label="Pulse Name"
                [formControlRef]="pulseRatingForm | getControl: 'pulseName'"
                type="text"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-select
                label="Service Type"
                [options]="serviceTypeOptions"
                optionValue="label"
                optionLabel="label"
                [formControlRef]="pulseRatingForm | getControl: 'serviceType'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-12">
              <custom-select
                label="Unit Type"
                [options]="filteredUnitOptions"
                optionValue="label"
                optionLabel="label"
                [formControlRef]="pulseRatingForm | getControl: 'unit'"
                [filter]="true"
                
              ></custom-select>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="No Of Units"
                [formControlRef]="pulseRatingForm | getControl: 'noOfUnits'"
                type="number"
              ></custom-input>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3"
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          class="btn btn-primary fs-13 fw-medium p-2 px-3"
          (click)="submit()"
        >
          {{ selectedPulseRating?.pulseId ? "Update" : "Save" }}
        </button>
      </div>
    </div>
  </div>
</div>
