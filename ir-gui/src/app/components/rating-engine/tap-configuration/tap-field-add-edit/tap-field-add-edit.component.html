<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>{{ selectedField?.id ? "Update" : "Create" }} TAP Field Mapping</h4>
        </div>
        <button type="button" class="close" (click)="onClose()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body" style="max-height: 72vh; overflow-y: auto;">
        <form [formGroup]="fieldForm">
          <div class="row">
            <!-- Basic Details -->
            <div class="col-lg-12">
              <h6 class="mb-3 fw-semibold text-primary">Field Specification</h6>
            </div>

            <div class="col-lg-6">
              <custom-select
                label="Call Type"
                [formControlRef]="fieldForm | getControl: 'callType'"
                [options]="callTypeOptions"
                optionValue="value"
                optionLabel="label"
                placeholder="Select Call Type"
              ></custom-select>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="Field Name"
                [formControlRef]="fieldForm | getControl: 'fieldName'"
                type="text"
                placeholder="e.g. dialledDigits"
              ></custom-input>
            </div>

            <div class="col-lg-6 mt-3">
              <custom-input
                label="ASN.1 Path (dot notation)"
                [formControlRef]="fieldForm | getControl: 'asnPath'"
                type="text"
                placeholder="e.g. basicCallInfo.destination.dialledDigits"
              ></custom-input>
            </div>
            <div class="col-lg-6 mt-3">
              <custom-select
                label="Data Type"
                [formControlRef]="fieldForm | getControl: 'dataType'"
                [options]="dataTypeOptions"
                optionValue="value"
                optionLabel="label"
              ></custom-select>
            </div>

            <!-- Mappings and Defaults -->
            <div class="col-lg-12 mt-4">
              <h6 class="mb-3 fw-semibold text-primary">Mapping & Fallback</h6>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="TAP OUT Source Column (RatedCdr property)"
                [formControlRef]="fieldForm | getControl: 'outSourceColumn'"
                type="text"
                placeholder="e.g. calledNumber"
              ></custom-input>
            </div>
            <div class="col-lg-6">
              <custom-input
                label="TAP IN Target Column (TapCdrDTO property)"
                [formControlRef]="fieldForm | getControl: 'inTargetColumn'"
                type="text"
                placeholder="e.g. calledNumber"
              ></custom-input>
            </div>

            <div class="col-lg-6 mt-3">
              <custom-input
                label="Default Value (Global Fallback)"
                [formControlRef]="fieldForm | getControl: 'defaultValue'"
                type="text"
                placeholder="e.g. 00000000"
              ></custom-input>
            </div>
            
            <div class="col-lg-6 mt-4">
              <div class="mb-3">
                <label class="form-label d-block fw-medium">Required Constraint</label>
                <div class="form-check form-switch mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    formControlName="isMandatory"
                    id="isMandatory"
                  />
                  <label class="form-check-label" for="isMandatory">
                    {{ fieldForm.get('isMandatory')?.value ? 'Mandatory (Fails parser if null)' : 'Optional' }}
                  </label>
                </div>
              </div>
            </div>

          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3" (click)="onClose()">
          Cancel
        </button>
        <button class="btn btn-primary fs-13 fw-medium p-2 px-3" (click)="submit()">
          {{ selectedField?.id ? "Update" : "Save" }}
        </button>
      </div>
    </div>
  </div>
</div>
