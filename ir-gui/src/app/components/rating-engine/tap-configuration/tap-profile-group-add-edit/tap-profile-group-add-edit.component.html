<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>{{ groupId ? "Update" : "Create" }} TAP Profile Group</h4>
      <h6>{{ groupId ? "Modify existing" : "Define new" }} combined rulesets for voice, SMS, and usage</h6>
    </div>
  </div>
  <div class="page-btn">
    <a (click)="onClose()" class="btn btn-outline-secondary d-flex align-items-center">
      <i class="ti ti-arrow-left me-2"></i>Back to List
    </a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form [formGroup]="groupForm">
      <div class="row">
        <div class="col-lg-12 mb-3">
          <h5 class="fw-semibold text-primary">Profile Group Information</h5>
          <hr class="mt-2 mb-4" />
        </div>

        <div class="col-lg-6">
          <custom-input
            label="Group Name"
            [formControlRef]="groupForm | getControl: 'name'"
            type="text"
            placeholder="e.g. Tap 3.12 Combined"
          ></custom-input>
        </div>
        
        <div class="col-lg-6">
          <custom-input
            label="Description"
            [formControlRef]="groupForm | getControl: 'description'"
            type="text"
            placeholder="e.g. Combined voice and SMS profiles"
          ></custom-input>
        </div>

        <!-- Profile Selections -->
        <div class="col-lg-12 mt-4 mb-3">
          <h5 class="fw-semibold text-primary">Associated TAP Profiles</h5>
          <hr class="mt-2 mb-4" />
        </div>

        <div class="col-lg-4 mt-2">
          <custom-select
            label="Voice Profile"
            [options]="voiceProfiles"
            optionValue="id"
            optionLabel="profileName"
            [formControlRef]="groupForm | getControl: 'voiceProfileId'"
            [filter]="true"
            placeholder="Select Voice Profile"
          ></custom-select>
        </div>

        <div class="col-lg-4 mt-2">
          <custom-select
            label="SMS Profile"
            [options]="smsProfiles"
            optionValue="id"
            optionLabel="profileName"
            [formControlRef]="groupForm | getControl: 'smsProfileId'"
            [filter]="true"
            placeholder="Select SMS Profile"
          ></custom-select>
        </div>

        <div class="col-lg-4 mt-2">
          <custom-select
            label="Usage Profile"
            [options]="usageProfiles"
            optionValue="id"
            optionLabel="profileName"
            [formControlRef]="groupForm | getControl: 'usageProfileId'"
            [filter]="true"
            placeholder="Select Usage Profile"
          ></custom-select>
        </div>

        <div class="col-lg-12 mt-4">
          <div class="mb-3">
            <label class="form-label d-block fw-medium">Status</label>
            <div class="form-check form-switch mt-2">
              <input
                class="form-check-input"
                type="checkbox"
                formControlName="isActive"
                id="groupIsActive"
              />
              <label class="form-check-label" for="groupIsActive">
                {{ groupForm.get('isActive')?.value ? 'Active' : 'Inactive' }}
              </label>
            </div>
          </div>
        </div>

      </div>
    </form>

    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
      <button type="button" class="btn btn-light me-2 fs-13 fw-semibold p-2 px-3" (click)="onClose()">
        Cancel
      </button>
      <button type="button" class="btn btn-primary fs-13 fw-semibold p-2 px-3" (click)="submit()">
        {{ groupId ? "Update" : "Save" }}
      </button>
    </div>
  </div>
</div>
