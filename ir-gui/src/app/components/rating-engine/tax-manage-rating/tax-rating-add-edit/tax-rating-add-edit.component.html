<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>{{ isEditMode ? "Update" : "Create" }} Tax Configuration</h4>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        (click)="toggleCollapse()"
        [class.active]="isCollapsed"
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        matTooltip="Collapse"
        id="collapse-header"
      >
        <i class="ti ti-chevron-up"></i>
      </a>
    </li>
    <li>
      <div class="page-btn mt-0">
        <button type="button" class="btn me-2 btn-secondary" (click)="onClose()">
          <i class="feather icon-arrow-left me-2"></i>Back to Tax Configuration List
        </button>
      </div>
    </li>
  </ul>
</div>

<div class="card d-flex flex-column">
  <div class="card-body">
    <form [formGroup]="taxRatingForm">
      <div class="row">
        <!-- Basic Identification -->
        <div class="col-lg-12">
          <h6 class="mb-3 fw-semibold text-primary">Basic Identification</h6>
        </div>

        <div class="col-lg-6">
          <div class="mb-3">
            <custom-select
              label="Tax Type"
              [formControlRef]="taxRatingForm | getControl: 'taxType'"
              [options]="taxTypeOptions"
              optionValue="value"
              optionLabel="label"
              placeholder="Select Tax Type"
            ></custom-select>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <custom-input
              label="Tax Name"
              [formControlRef]="taxRatingForm | getControl: 'taxName'"
              type="text"
              placeholder="Display Name"
            ></custom-input>
          </div>
        </div>

        <!-- Rate & Logic -->
        <div class="col-lg-12 mt-3">
          <h6 class="mb-3 fw-semibold text-primary">Rate & Logic</h6>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <custom-input
              label="Standard Rate (%)"
              [formControlRef]="taxRatingForm | getControl: 'standardRate'"
              type="number"
              placeholder="0.00"
            ></custom-input>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <custom-select
              label="Apply On"
              [formControlRef]="taxRatingForm | getControl: 'applyOn'"
              [options]="applyOnOptions"
              optionValue="value"
              optionLabel="label"
            ></custom-select>
          </div>
        </div>

        <!-- Compliance & Dates -->
        <div class="col-lg-12 mt-3">
          <h6 class="mb-3 fw-semibold text-primary">Compliance & Validity</h6>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <custom-date
              label="Effective From"
              [formControlRef]="taxRatingForm | getControl: 'effectiveFrom'"
            ></custom-date>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <custom-date
              label="Effective To (Optional)"
              [formControlRef]="taxRatingForm | getControl: 'effectiveTo'"
            ></custom-date>
          </div>
        </div>
        
        <div class="col-lg-4 mt-2">
          <div class="mb-3">
            <label class="form-label d-block fw-medium">Input Credit</label>
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                formControlName="allowsInputCredit"
              />
              <label class="form-check-label">{{ taxRatingForm.get('allowsInputCredit')?.value ? 'Allowed' : 'Not Allowed' }}</label>
            </div>
          </div>
        </div>
        <div class="col-lg-4 mt-2">
          <div class="mb-3">
            <label class="form-label d-block fw-medium">Status</label>
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                formControlName="isActive"
              />
              <label class="form-check-label">{{ taxRatingForm.get('isActive')?.value ? 'Active' : 'Inactive' }}</label>
            </div>
          </div>
        </div>

      </div>
    </form>
  </div>

  <div class="card-footer d-flex align-items-center justify-content-between">
    <button type="button" class="btn btn-secondary fs-13 fw-medium p-2 px-3" (click)="onClose()">
      Cancel
    </button>
    <button class="btn btn-primary fs-13 fw-medium p-2 px-3" (click)="submit()">
      {{ isEditMode ? "Update" : "Save" }}
    </button>
  </div>
</div>
