<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>{{ selectedPrompt?.id ? "Update" : "Create" }} Audio Prompt</h4>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        (click)="toggleCollapse()"
        [class.active]="isCollapsed"
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        id="collapse-header"
      >
        @if (!isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
        @if (isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
      </a>
    </li>
    <li>
      <div class="page-btn mt-0">
        <button
          type="button"
          class="btn me-2 btn-secondary"
          (click)="onCancel()"
          [disabled]="isLoading"
        >
          <i class="feather icon-arrow-left me-2"></i>Back to Audio Prompts List
        </button>
      </div>
    </li>
  </ul>
</div>

<div *ngIf="isLoading && selectedPrompt?.id" class="card">
  <div class="card-body text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Loading audio prompt data...</p>
  </div>
</div>

<div class="card" *ngIf="!isLoading || !selectedPrompt?.id">
  <div class="card-header">
    <h4>Audio Prompt Information</h4>
  </div>
  <div class="card-body profile-body">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-lg-6 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              label="Name"
              [formControlRef]="form | getControl: 'name'"
              type="text"
              placeholder="Enter Name"
              required="true"
            ></custom-input>
          </div>
        </div>

        <div class="col-lg-6 col-md-6 col-12">
          <div class="mb-3">
            <div class="position-relative">
              <custom-input
                label="Select File"
                [formControlRef]="fileDisplayControl"
                type="text"
                placeholder="No file selected"
                readonly="true"
              />
              <button
                type="button"
                class="btn btn-primary select-file-btn"
                (click)="fileInput.click()"
              >
                Select file
              </button>
              <input
                #fileInput
                type="file"
                class="d-none"
                accept="audio/*,.wav,.mp3,.ogg"
                (change)="onFileSelected($event)"
              />
            </div>
            <div
              class="text-danger small mt-1"
              *ngIf="submitted && !selectedFile && !selectedPrompt?.id"
            >
              Audio file is required
            </div>
            <div class="text-muted small mt-1">
              Supported formats: MP3, WAV, OGG (Max size: 10MB)
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card mt-3" *ngIf="!isLoading || !selectedPrompt?.id">
  <div class="card-body">
    <div class="d-flex justify-content-end gap-2">
      <button
        class="btn btn-secondary"
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading"
      >
        Cancel
      </button>
      <button
        class="btn btn-warning"
        type="button"
        *ngIf="selectedPrompt?.id"
        (click)="clearForm()"
        [disabled]="isLoading"
      >
        Clear
      </button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="onSubmit()"
        [disabled]="
          isLoading || form.invalid || (!selectedFile && !selectedPrompt?.id)
        "
      >
        <span
          class="spinner-border spinner-border-sm me-2"
          *ngIf="isLoading"
        ></span>
        {{ selectedPrompt?.id ? "Update" : "Save" }}
      </button>
    </div>
  </div>
</div>
