<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>Email SMTP Configuration</h4>
      <h6>Configure your SMTP email settings</h6>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        (click)="toggleCollapse()"
        [class.active]="isCollapsed"
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        id="collapse-header"
      >
        @if (!isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
        @if (isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
      </a>
    </li>
  </ul>
</div>

<div *ngIf="isLoading" class="card">
  <div class="card-body text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Loading SMTP configuration...</p>
  </div>
</div>

<div class="card smtp-config-card" *ngIf="!isLoading">
  <div class="card-header">
    <h4>Email SMTP</h4>
  </div>
  <div class="card-body">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              [formControlRef]="form | getControl: 'host'"
              type="text"
              placeholder="Enter Host"
              required="true"
              label="Host"
            ></custom-input>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              [formControlRef]="form | getControl: 'port'"
              type="text"
              placeholder="Enter Port"
              required="true"
              label="Port"
            ></custom-input>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              [formControlRef]="form | getControl: 'from'"
              type="text"
              placeholder="Enter From"
              required="true"
              label="From"
            ></custom-input>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              [formControlRef]="form | getControl: 'username'"
              type="text"
              placeholder="Enter Username"
              required="true"
              label="Username"
            ></custom-input>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <div class="password-input-wrapper">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="ti ti-lock"></i>
                </span>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="password"
                  placeholder="Enter Password"
                  [class.is-invalid]="
                    submitted && form.get('password')?.errors?.['required']
                  "
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  (click)="togglePasswordVisibility()"
                >
                  <i
                    class="ti"
                    [class.ti-eye]="!showPassword"
                    [class.ti-eye-off]="showPassword"
                  ></i>
                </button>
              </div>
            </div>
            <div
              class="text-danger small mt-1"
              *ngIf="submitted && form.get('password')?.errors?.['required']"
            >
              Password is required
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="card-footer">
    <div class="d-flex justify-content-end gap-2">
      <button
        class="btn btn-outline-secondary"
        type="button"
        (click)="resetForm()"
        [disabled]="isSaving"
      >
        Reset
      </button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="onSave()"
        [disabled]="isSaving || form.invalid"
      >
        <span
          class="spinner-border spinner-border-sm me-2"
          *ngIf="isSaving"
        ></span>
        Save
      </button>
    </div>
  </div>
</div>
