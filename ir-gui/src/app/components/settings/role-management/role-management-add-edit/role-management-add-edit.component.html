<div class="col" id="role-add-edit-dialog">
  <div class="modal-header">
    <div class="page-title">
      <h4>{{ data?.id ? "Update " : "Create " }} Role</h4>
    </div>

    <div class="page-btn">
      <button
        [disabled]="isDisable"
        type="button"
        class="btn me-2 btn-secondary"
        (click)="onClose()"
      >
        <i class="feather icon-arrow-left me-2"></i>Back to role List
      </button>
    </div>
  </div>
  <div class="modal-body pt-1">
    <form class="col-lg-10" [formGroup]="roleForm">
      <div class="row">
        <div class="col-lg-5">
          <custom-input
            label="Role Name"
            [formControlRef]="roleForm | getControl: 'rolename'"
            type="text"
          ></custom-input>
        </div>
        <div class="col-lg-5">
          <custom-select
            label="Status"
            [options]="statusOptions"
            optionValue="label"
            optionLabel="label"
            [formControlRef]="roleForm | getControl: 'status'"
            [filter]="true"
            [showClear]="true"
          ></custom-select>
        </div>
      </div>
    </form>
  </div>

  <p-treeTable
    [value]="tableData"
    selectionMode="single"
    [metaKeySelection]="true"
  >
    <ng-template #header>
      <tr>
        <th>Operations</th>
        <th class="flex-class">
          <custom-checkbox [formControlRef]="selectAllFC"></custom-checkbox>
          <span class="pl-1"> Permissions </span>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-rowNode let-rowData="rowData" let-i="rowIndex">
      <tr
        [ttRow]="rowNode"
        class=""
        [style.background-color]="
          rowNode.level == 0 ? 'rgb(240, 240, 240)' : ''
        "
      >
        <td>
          <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>
          <span
            [style.font-weight]="
              rowNode.node.children?.length > 0 ? 'bold' : 'normal'
            "
          >
            {{ rowData.name }}
          </span>
        </td>
        <td>
          <custom-checkbox
            *ngIf="!isLoading"
            [formControlRef]="
              permissionFG | getControl: rowData?.tempControlName
            "
          ></custom-checkbox>
        </td>
      </tr>
    </ng-template>
  </p-treeTable>

  @if (tableData.length == 0) {
    <table class="col-lg-12">
      <tr>
        <td colspan="12">
          <h5 class="no-record">No records found</h5>
        </td>
      </tr>
    </table>
  }

  <div class="col-md-12 card-body modal-footer row pt-3">
    <button
      [disabled]="isDisable"
      type="button"
      class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3 col-lg-1"
      (click)="onClose()"
    >
      Cancel
    </button>
    <button
      class="btn btn-primary fs-13 fw-medium p-2 px-3 col-lg-1"
      [disabled]="tableData.length == 0 || isDisable"
      (click)="submit()"
    >
      {{ data && data?.id ? "Update" : "Save" }}
    </button>
  </div>
</div>
