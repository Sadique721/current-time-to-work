<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>Add New Receipt</h4>
        </div>
        <button
          type="button"
          class="close"
          (click)="onClose()"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="paymentReciptForm">
          <div class="row">
            <div class="col-lg-12">
              <custom-input
                label="Prefix"
                [formControlRef]="paymentReciptForm | getControl: 'prefix'"
                type="text"
                placeholder="Enter Prefix"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="Receipt From"
                [formControlRef]="paymentReciptForm | getControl: 'receiptFrom'"
                type="number"
                placeholder="Enter Receipt From"
              ></custom-input>
            </div>
            <div class="col-lg-12">
              <custom-input
                label="Receipt To"
                [formControlRef]="paymentReciptForm | getControl: 'receiptTo'"
                type="number"
                placeholder="Enter Receipt To"
              ></custom-input>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3"
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          class="btn btn-primary fs-13 fw-medium p-2 px-3"
          type="button"
          (click)="addNewReceipt()"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
