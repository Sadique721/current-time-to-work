<div class="modal-content">
  <div class="page-wrapper-new p-0">
    <div class="content p-0">
      <div class="modal-header">
        <div class="page-title">
          <h4>Change Password</h4>
        </div>
        <button
          type="button"
          class="close"
          (click)="onClose()"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="changePasswordForm">
          <div class="row">
            <div class="col-lg-12">
              <custom-input
                label="Username"
                [formControlRef]="changePasswordForm | getControl: 'userName'"
                type="text"
                placeholder="username"
              ></custom-input>
            </div>

            @if (ifgenerateOtpField) {
              <div class="col-lg-12">
                <div class="d-flex justify-content-end mb-3">
                  <button
                    class="btn btn-primary btn-sm fs-13 fw-medium p-2 px-3"
                    type="button"
                    (click)="generateOtp()"
                    [disabled]="isOtpGenerated"
                  >
                    Generate OTP
                  </button>
                </div>
              </div>

              <div class="col-lg-12" *ngIf="isOtpGenerated">
                <custom-input
                  label="OTP"
                  [formControlRef]="changePasswordForm | getControl: 'otp'"
                  type="text"
                  placeholder="Enter OTP (default: 123456)"
                ></custom-input>
                <small class="text-muted"
                  >Default OTP for testing: 123456</small
                >
              </div>

            } @else {
              <div class="col-lg-12">
                <custom-input
                  label="New Password"
                  [formControlRef]="
                    changePasswordForm | getControl: 'newPassword'
                  "
                  type="password"
                  placeholder="Enter new password"
                ></custom-input>
              </div>

              <div class="col-lg-12">
                <custom-input
                  label="Confirm Password"
                  [formControlRef]="
                    changePasswordForm | getControl: 'confirmPassword'
                  "
                  type="password"
                  placeholder="Confirm new password"
                ></custom-input>
              </div>

              <div class="col-lg-12">
                <small class="text-muted">
                  Password must be at least 8 characters long
                </small>
              </div>
            }
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3"
          (click)="onClose()"
        >
          Cancel
        </button>

        @if (ifgenerateOtpField) {
          <button
            class="btn btn-primary fs-13 fw-medium p-2 px-3"
            type="button"
            (click)="validateOtp()"
            [disabled]="
              !isOtpGenerated || !changePasswordForm.get('otp')?.value
            "
          >
            Validate OTP
          </button>
        } @else {
          <button
            class="btn btn-primary fs-13 fw-medium p-2 px-3"
            type="button"
            (click)="changePassword()"
            [disabled]="
              changePasswordForm.get('newPassword')?.invalid ||
              changePasswordForm.get('confirmPassword')?.invalid
            "
          >
            Save
          </button>
        }
      </div>
    </div>
  </div>
</div>
