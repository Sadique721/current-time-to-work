<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>{{ selectedTelecomCircle?.id ? "Update" : "Create" }} Telecom Circle</h4>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a
        (click)="toggleCollapse()"
        [class.active]="isCollapsed"
        data-bs-toggle="tooltip"
        data-bs-placement="top"
        id="collapse-header"
      >
        @if (!isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
        @if (isCollapsed) {
          <i class="ti ti-chevron-up"></i>
        }
      </a>
    </li>
    <li>
      <div class="page-btn mt-0">
        <button
          type="button"
          class="btn me-2 btn-secondary"
          (click)="onCancel()"
          [disabled]="isLoading"
        >
          <i class="feather icon-arrow-left me-2"></i>Back to Telecom Circle List
        </button>
      </div>
    </li>
  </ul>
</div>

<div *ngIf="isLoading" class="card">
  <div class="card-body text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Loading telecom circle data...</p>
  </div>
</div>

<div class="card" *ngIf="!isLoading">
  <div class="card-header">
    <h4>Telecom Circle Information</h4>
  </div>
  <div class="card-body profile-body">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              label="Circle Name"
              [formControlRef]="form | getControl: 'name'"
              type="text"
              placeholder="Enter Circle Name"
              required="true"
            ></custom-input>
            <div
              class="text-danger small mt-1"
              *ngIf="submitted && form.get('name')?.errors?.['required']"
            >
              Circle Name is required
            </div>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <custom-input
              label="Prefix"
              [formControlRef]="form | getControl: 'prefix'"
              type="text"
              placeholder="Enter Prefix"
              required="true"
            ></custom-input>
            <div
              class="text-danger small mt-1"
              *ngIf="submitted && form.get('prefix')?.errors?.['required']"
            >
              Prefix is required
            </div>
          </div>
        </div>

        <div class="col-lg-4 col-md-6 col-12">
          <div class="mb-3">
            <label class="form-label">Status</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="status"
                  id="statusEnable"
                  value="1"
                  formControlName="status"
                />
                <label class="form-check-label" for="statusEnable">
                  Enable
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="status"
                  id="statusDisable"
                  value="0"
                  formControlName="status"
                />
                <label class="form-check-label" for="statusDisable">
                  Disable
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card mt-3" *ngIf="!isLoading">
  <div class="card-body">
    <div class="d-flex justify-content-end gap-2">
      <button
        class="btn btn-secondary"
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading"
      >
        Cancel
      </button>
      <button
        class="btn btn-warning"
        type="button"
        *ngIf="selectedTelecomCircle?.id"
        (click)="clearForm()"
        [disabled]="isLoading"
      >
        Clear
      </button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="onSubmit()"
        [disabled]="isLoading || form.invalid"
      >
        <span
          class="spinner-border spinner-border-sm me-2"
          *ngIf="isLoading"
        ></span>
        {{ selectedTelecomCircle?.id ? "Update" : "Save" }}
      </button>
    </div>
  </div>
</div>
