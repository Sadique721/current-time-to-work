<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="page-wrapper-new p-0">
      <div class="content p-5 px-3 text-center">
        <span
          class="rounded-circle d-inline-flex p-2 bg-danger-transparent mb-2"
        >
          <i [ngClass]="data.iconClass || 'ti ti-trash fs-24 text-danger'"></i>
        </span>
        <h4 class="fs-20 text-gray-9 fw-bold mb-2 mt-1">{{ data.title }}</h4>
        <p class="text-gray-6 mb-0 fs-16">{{ data.message }}</p>

        <div class="modal-footer-btn mt-3 d-flex justify-content-center">
          <button
            type="button"
            class="btn me-2 btn-secondary fs-13 fw-medium p-2 px-3 shadow-none"
            (click)="onCancel()"
          >
            {{ data.cancelButtonText || "Cancel" }}
          </button>
          <button
            type="button"
            class="btn btn-primary fs-13 fw-medium p-2 px-3"
            (click)="onConfirm()"
          >
            {{ data.confirmButtonText || "Yes Delete" }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
