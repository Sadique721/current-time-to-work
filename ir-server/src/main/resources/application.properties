spring.application.name=ocs
server.port=8060
server.address=0.0.0.0
server.servlet.context-path=/rating-engine/v1

spring.datasource.url=jdbc:mysql://localhost:3306/xcessocs?allowPublicKeyRetrieval=true&useSSL=false&autoreconnect=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=0721
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_ENUMS=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Content negotiation configuration
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json
# Remove these deprecated properties
# spring.http.encoding.charset=UTF-8
# spring.http.encoding.enabled=true
# spring.http.encoding.force=tru
# Replace with these new properties
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

logging.level.org.springframework.boot.actuate=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

cache.refresh.interval=300000

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
kafka.subscription.refresh.interval=300000
spring.kafka.consumer.group-id=ocs-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.concurrency=3
spring.kafka.consumer.properties.spring.json.trusted.packages=*

logging.level.root=INFO
logging.level.com.xcess.ocs=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=OFF

# Keep essential logs
logging.level.org.springframework.kafka=INFO

# Suppress overly verbose internal Kafka logs
logging.level.org.apache.kafka.clients.consumer=ERROR
logging.level.org.apache.kafka.clients.Metadata=ERROR
logging.level.org.apache.kafka.common.utils.AppInfoParser=ERROR
logging.level.org.apache.kafka.common.metrics=ERROR
logging.level.org.apache.kafka.clients.FetchSessionHandler=ERROR
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=ERROR
logging.level.org.apache.kafka.clients.consumer.internals.SubscriptionState=ERROR

billingCycleCronScheduler=0 0 2 * * *

invoice.storage.base-path=C:/INTER-CONNECT/data/invoices

# Roaming TAP file watcher
roaming.tap.watch-dir=C:/INTER-CONNECT/data/tap-files/inbox
roaming.tap.poll-interval-ms=60000
roaming.tap.pull-enabled=false
# Roaming TAP OUT file generation
# Directory where generated TAP OUT ASN files are written
roaming.tap.outbox-dir=C:/INTER-CONNECT/data/tap-files/outbox
# Our own TADIG code — used as sender in TAP OUT filenames and BatchControlInfo
roaming.tap.our-tadig=EUR01
# Daily cron for TAP OUT generation (default: every day at 01:00:00 AM )
# Processes previous day's rated_cdr records
roaming.tap.out-cron=0 0 1 * * ?

# Daily cron for TAP OUT summary generation (default: every day at 03:00:00 AM)
# Runs AFTER TapOutScheduler has marked CDRs with isTapOutGenerated=true
roaming.summary.cron=0 0 3 * * ?

# Rounding Configuration
ocs.rounding.price-precision=4
ocs.rounding.duration-precision=2
ocs.rounding.invoice-precision=4
ocs.rounding.calculation-precision=6
ocs.rounding.display-precision=2
ocs.rounding.rounding-mode=HALF_UP

spring.main.allow-bean-definition-overriding=true

# ==========================================
# EXCHANGE RATE SCHEDULER CONFIGURATION
# ==========================================

# Scheduler cron (default: daily at midnight)
exchangeRateScheduler.cron=0 0 0 * * ?

# External API (Frankfurter - free, no key, unlimited)
# {baseCurrency} is replaced with exchangeRate.base-currency value
exchangeRate.api.url=https://api.frankfurter.app/latest?from={baseCurrency}

# Request timeout in milliseconds
exchangeRate.api.timeout=10000

# Decimal precision for rates
exchangeRate.rate-precision=6

# Base currencies (comma-separated list of active settlement base currencies)
exchangeRate.base-currencies=INR,USD

eureka.client.enabled=false

# CORS
cors.allowed-origins=http://localhost:4200

# ==========================================
# ERROR RECOVERY / RE-RATE POLLING SCHEDULER
# ==========================================
cron.executor.core-pool-size=2
cron.executor.max-pool-size=2
cron.executor.keep-alive-time=60
cron.executor.queue-capacity=10
cron.executor.min-interval=5s
cron.executor.max-interval=5m
cron.executor.backoff-factor=2.0
cron.executor.multiplier-unit=5