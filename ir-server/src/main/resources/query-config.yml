query-templates:

  # ─────────────────────────────────────────────────────────────────────────────
  # VOICE OUTGOING
  # ─────────────────────────────────────────────────────────────────────────────
  rated-summary-outgoing-daily:
    table: "voice_rated_cdr rc"
    joins:
      - type: "LEFT JOIN"
        table: "accounts a"
        condition: "rc.outgoing_account_id = a.account_code_or_hplmn"
      - type: "LEFT JOIN"
        table: "partners p"
        condition: "a.partner_id = p.partner_id"
      - type: "LEFT JOIN"
        table: "prefixes sp"
        condition: "rc.outgoing_matched_source_prefix = sp.prefix"
      - type: "LEFT JOIN"
        table: "countries sc"
        condition: "sp.country_id = sc.country_id"
      - type: "LEFT JOIN"
        table: "prefixes dp"
        condition: "rc.outgoing_matched_destination_prefix = dp.prefix"
      - type: "LEFT JOIN"
        table: "countries dc"
        condition: "dp.country_id = dc.country_id"
    select-columns:
      - expression: "DATE(COALESCE(rc.rated_at, rc.modified_date))"
        alias: "summary_date"
      - expression: "rc.outgoing_account_id"
        alias: "account_code"
      - expression: "p.partner_id"
        alias: "partner_id"
      - expression: "p.partner_name"
        alias: "partner_name"
      - expression: "rc.outgoing_matched_source_prefix"
        alias: "source_prefix"
      - expression: "sp.prefix_name"
        alias: "source_prefix_name"
      - expression: "sc.country_code"
        alias: "source_country_code"
      - expression: "sc.name"
        alias: "source_country_name"
      - expression: "CASE WHEN rc.zone_name IS NULL THEN rc.outgoing_matched_destination_prefix ELSE NULL END"
        alias: "destination_prefix"
      - expression: "CASE WHEN rc.zone_name IS NULL THEN dp.prefix_name ELSE NULL END"
        alias: "destination_prefix_name"
      - expression: "CASE WHEN rc.zone_name IS NULL THEN dc.country_code ELSE NULL END"
        alias: "destination_country_code"
      - expression: "CASE WHEN rc.zone_name IS NULL THEN dc.name ELSE NULL END"
        alias: "destination_country_name"
      - expression: "rc.zone_name"
        alias: "zone_name"
      - expression: "CASE WHEN rc.outgoing_matched_source_prefix IS NOT NULL THEN 'SOURCE_DESTINATION_BASED' WHEN rc.zone_name IS NOT NULL THEN 'ZONE_DESTINATION_BASED' ELSE 'DESTINATION_BASED' END"
        alias: "rating_type"
      - expression: "'VOICE'"
        alias: "service_type"
      - expression: "rc.outgoing_applied_rate"
        alias: "applied_rate"
      - expression: "COUNT(*)"
        alias: "total_calls"
      - expression: "SUM(rc.duration_seconds)"
        alias: "total_duration"
      - expression: "SUM(rc.outgoing_total_cost)"
        alias: "total_charge"
    where-conditions:
      - column: "rc.modified_date"
        operator: ">="
        parameterName: "startTime"
      - column: "rc.modified_date"
        operator: "<="
        parameterName: "endTime"
      - column: "rc.outgoing_rating_status"
        operator: "="
        parameterName: "ratingStatus"
      - column: "rc.is_deleted"
        operator: "="
        parameterName: "isDeleted"
      - column: "rc.is_summarized"
        operator: "="
        parameterName: "isSummarized"
      - column: "rc.line_of_business"
        operator: "="
        parameterName: "lineOfBusiness"
    group-by:
      - "DATE(COALESCE(rc.rated_at, rc.modified_date))"
      - "rc.outgoing_account_id"
      - "p.partner_id"
      - "p.partner_name"
      - "rc.outgoing_matched_source_prefix"
      - "sp.prefix_name"
      - "sc.country_code"
      - "sc.name"
      - "rc.outgoing_matched_destination_prefix"
      - "dp.prefix_name"
      - "dc.country_code"
      - "dc.name"
      - "rc.zone_name"
      - "rc.outgoing_applied_rate"
    order-by:
      - column: "total_charge"
        direction: "DESC"

